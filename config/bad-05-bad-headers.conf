server {
    listen 8080;
    server_name localhost;
    root ./www/Pages;
    autoindex on;

    # error_page con formato incorrecto
    error_page 404;               # falta el path
    error_page /Errors/404.html;  # falta el código

    # return con código inválido
    location /bad-return {
        return abc https://example.com;
    }

    # return con código válido pero URL mal
    location /bad-url {
        return 301;
    }

    # limit_except con método inválido
    location /bad-method {
        limit_except FOO BAR;
    }

    # cgi_handler mal formado
    location /bad-cgi {
        cgi_handler;
    }

    # upload_store sin path
    location /bad-upload {
        upload_store;
    }
}