server {
    listen 999999;                # puerto inválido (> 65535)
    server_name localhost;
    root ./www/Pages;
    autoindex maybe;              # debe ser on/off
    error_page abc /Errors/404.html;   # código no numérico
    client_max_body_size 10Z;     # sufijo inválido
}

