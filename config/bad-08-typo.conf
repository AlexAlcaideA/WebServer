server {
    listen 8080;
    server_name localhost;
    root ./www/Pages;
    autoindex on;
    error_page 404 /Errors/404.html;

    location / {
    }

    location /upload {
        limit_except POST;
        upload_store ./www/Uploads;
        client_max_body_size 10M;
}
# Falta el `}` final del server → desbalanceado