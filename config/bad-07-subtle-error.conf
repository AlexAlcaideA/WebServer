server {
    listen 8080;
    server_name localhost;
    root ./www/Pages;
    autoindex on;
    error_page 404 /Errors/404.html;

    location / {
    }

    location /upload {
        limit_except POST;
        upload_store ./www/Uploads;
        client_max_body_size 10M;
    }

    location /CGI {
        root ./www;
        cgi_handler .py /usr/bin/python3;    # este está bien
        cgi_handler .py /usr/bin/python2;    # duplicado → error
        limit_except GET POST;
    }
}